[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits real HTML files for every route, including /projects/<slug>.
# No SPA fallback rewrite: a missing route must genuinely 404.

# Pretty URLs is on by default and 301s /services to /services/, which
# contradicts `trailingSlash: 'never'` in astro.config.ts. Left on, every
# internal link costs a redirect and the canonical URL the SEO component
# emits is not the URL the visitor ends on.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Fingerprinted build assets are immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
